<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QCArchive Web GUI</title>

    <script>
      // Get theme from localStorage or default to browser preference
      const browserTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      const savedTheme = localStorage.getItem('mui-mode') || browserTheme;
      const themeMode = (savedTheme === 'system') ? browserTheme : savedTheme;

      // Set the attribute that Material-UI looks for
      document.documentElement.setAttribute('data-mui-color-scheme', themeMode);

      // Set the background color of the body and the text color
      document.documentElement.style.backgroundColor = themeMode === 'dark' ? 'rgb(5,7,10)' : 'rgb(252,252,252)';
      document.documentElement.style.color = themeMode === 'dark' ? 'rgb(252,252,252)' : 'rgb(5,7,10)';

      // Optional: Set a CSS class as well for additional styling
      document.documentElement.className = themeMode;
    </script>



  <style>
    #initial-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }

    .spinner-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #1976d2;
      animation: spin 0.8s linear infinite;
    }

    .spinner-label {
      font-family: sans-serif;
      font-size: 0.875rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  </head>
  <body>
    <!-- the root for react; spinner is replaced automatically when React mounts -->
    <div id="root">
      <div id="initial-spinner">
        <div class="spinner-circle"></div>
        <span class="spinner-label">Loading...</span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
